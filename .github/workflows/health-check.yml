
name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Render application health
        run: |
          curl --fail --show-error --silent \
            --location \
            --retry 3 \
            --retry-delay 15 \
            --connect-timeout 20 \
            --max-time 120 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
          https://127.0.0.1:9999/
