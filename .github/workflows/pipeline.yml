
name: Simple Deployment Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fs-pokedex-main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Check style
        run: npm run eslint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

  deploy:
    needs: build_and_test
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        !contains(join(github.event.commits.*.message, ' '), '#skip')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --max-time 30 \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

  notify_success:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Discord Success Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Deployment Successful"
          description: |
            A new version was triggered for deployment to Render!
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
          color: 0x00ff00

  tag_release:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  notify_failure:
    needs: [build_and_test, deploy]
    if: >-
      ${{
        always() &&
        (
          needs.build_and_test.result == 'failure' ||
          needs.deploy.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Discord Failure Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Pipeline Failed"
          description: |
            Build, tests, or deployment trigger failed!
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xff0000
